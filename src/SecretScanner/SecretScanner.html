<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Secret Scanner</title>
    <!--
      The design system is extracted to a sibling stylesheet by
      mini-css-extract-plugin. This page is copied verbatim rather than generated
      by html-webpack-plugin, so the link has to be written by hand — without it
      the app renders with class names and no styles at all.
      Keep the href in sync with output.filename in webpack.config.js.
    -->
    <link rel="stylesheet" href="SecretScanner.css" />
    <style>
      html {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      /* #root deliberately has no padding here: an ID selector would outrank
         the .ax-root class rule in app.css. */
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        overflow: auto;
      }
      /* Only a base background so there is no flash before the bundle paints.
         Every other colour comes from the design tokens in app.css. */
      body {
        background: #f6f7fb;
      }
      :root[data-theme="dark"] body {
        background: #14181f;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) body {
          background: #14181f;
        }
      }
    </style>
    <script>
      // Stamp the persisted theme before the bundle parses so a dark host never
      // flashes light. Must match THEME_STORAGE_KEY in src/utils/theme.ts.
      (function () {
        try {
          var stored = window.localStorage.getItem("library-secret-scanner.theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {
          /* storage can be blocked in the extension iframe */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root" class="ax-root"></div>
    <script src="SecretScanner.js"></script>
  </body>
</html>
